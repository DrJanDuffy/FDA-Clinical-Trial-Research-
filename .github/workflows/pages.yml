name: Deploy — GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # On by default; set repository variable ENABLE_GITHUB_PAGES = false to stop
    # deploying. #7 made this opt-in because the job always died at
    # configure-pages with "Get Pages site failed" when Settings -> Pages had no
    # site. `enablement: true` below creates that site through the API instead,
    # so the failure mode it was guarding against no longer exists.
    if: vars.ENABLE_GITHUB_PAGES != 'false'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/build.js
      - uses: actions/configure-pages@v6
        with:
          # Creates the Pages site if it does not exist, so enabling the site is
          # not a manual step in repository settings. Needs pages: write, granted
          # at the workflow level above.
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # v4 started excluding dotfiles; dist/.nojekyll is one, and
          # scripts/build.js treats it as required output.
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
