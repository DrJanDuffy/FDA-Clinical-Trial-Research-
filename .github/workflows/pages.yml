name: Deploy — GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Two switches are needed, and only this one lives in the repo:
    #   1. repository variable ENABLE_GITHUB_PAGES = true
    #   2. Settings -> Pages -> Source set to "GitHub Actions"
    # Without (2) the job dies at configure-pages with "Get Pages site failed".
    #
    # configure-pages has an `enablement: true` input that is meant to create the
    # site over the API and remove step (2). It does not work here: #10 tried it
    # and the run failed with "Create Pages site failed. Error: Resource not
    # accessible by integration" — creating a Pages site needs admin rights that
    # the default GITHUB_TOKEN does not carry, and no amount of `permissions:`
    # grants them. Step (2) is a human action; do not try enablement again.
    if: vars.ENABLE_GITHUB_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/build.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # v4 started excluding dotfiles; dist/.nojekyll is one, and
          # scripts/build.js treats it as required output.
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
