name: Deploy — Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Disabled until you opt in, so an unconfigured account never fails CI.
# Enable:  repository variable ENABLE_CLOUDFLARE_WORKERS = true
# Secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit), CLOUDFLARE_ACCOUNT_ID
# Variable CLOUDFLARE_WORKER_NAME overrides the name in wrangler.jsonc, which
# matters on an account that already hosts other Workers.
# Least privilege: nothing here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    # Fork pull requests cannot read secrets, so skip them rather than fail.
    if: >-
      vars.ENABLE_CLOUDFLARE_WORKERS == 'true' &&
      github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build

      # main (and manual runs) promote the new version to the live deployment.
      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy ${{ vars.CLOUDFLARE_WORKER_NAME && format('--name={0}', vars.CLOUDFLARE_WORKER_NAME) || '' }}

      # Pull requests only upload a version. It gets its own preview URL, printed
      # in the step log, and live traffic keeps going to the current deployment.
      - name: Upload preview version
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload ${{ vars.CLOUDFLARE_WORKER_NAME && format('--name={0}', vars.CLOUDFLARE_WORKER_NAME) || '' }}
